<dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
  <form method="dialog">
    <h2 id="confirm-title">¿Seguro?</h2>
    <p id="confirm-text"></p>
    <div class="dialog-actions">
      <button class="btn btn-secondary" value="cancel" data-dialog-cancel>Cancelar</button>
      <button class="btn btn-danger" value="confirm" data-dialog-confirm>Eliminar</button>
    </div>
  </form>
</dialog>
